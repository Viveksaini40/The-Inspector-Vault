<body>
    <div class="login-container">
        <h2>The Inspector's Vault</h2>

        <!-- HINT FOR INTERNS: 
             If you are looking at this comment via View Source... Nice try!

        <form id="vaultForm" onsubmit="checkPassword(event)">
            <div class="input-group">
                <label for="password">Enter Administrative Access Key:</label>
                <input type="password" id="password" placeholder="••••••••••••" required>

        </form>
        <div id="message" class="message"></div>
